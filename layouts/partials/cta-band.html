<section class="section cta-band" id="contact">
  <div class="container">
    <p class="eyebrow" style="color: rgb(255 255 255 / .7)">Let's talk</p>
    <h2>{{ site.Params.ctaTitle }}</h2>
    <p>{{ site.Params.ctaBody }}</p>
    <div class="btn-row">
      <a class="btn btn--onbrand btn--lg" href="{{ site.Params.bookingUrl }}" rel="noopener">Book a 30-minute call</a>
      <a class="btn btn--onbrand-ghost btn--lg" href="mailto:{{ site.Params.email }}">Email me instead</a>
    </div>
  </div>
</section>
