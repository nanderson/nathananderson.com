name: Security Audit

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  schedule:
    # Run security audit daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  security-audit:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive
    
    - name: Setup Hugo
      uses: peaceiris/actions-hugo@v3
      with:
        hugo-version: '0.164.0'
        extended: true
    
    - name: Static Security Analysis
      run: |
        # Check for potential security issues in configuration
        echo "Checking Hugo configuration security..."
        
        # Check for unsafe rendering
        if grep -r "unsafe.*true" hugo.toml; then
          echo "::warning::Unsafe HTML rendering is enabled"
        fi
        
        # Check for hardcoded secrets
        echo "Scanning for potential secrets..."
        grep -r -i "password\|secret\|api[_-]key\|token" . --exclude-dir=.git --exclude-dir=public --exclude="*.md" || true
        
        # Check for potentially dangerous file permissions
        find . -type f -perm -o+w -not -path './.git/*' -not -path './public/*' || true
    
    - name: Third-party resource check
      run: |
        hugo --gc --minify
        python3 - <<'PY'
        import glob, re, sys
        # Only resource loads are governed by CSP — outbound <a href> links are not.
        ALLOWED = {"https://www.googletagmanager.com"}
        pat = re.compile(
            r'<(script|link|img|iframe|source|video|audio|embed|object)\b[^>]*?'
            r'\b(?:src|href|data)="(https?://[^"]+)"', re.I)
        found = {}
        for f in glob.glob("public/**/*.html", recursive=True):
            for tag, url in pat.findall(open(f, encoding="utf-8", errors="ignore").read()):
                origin = re.match(r"https?://[^/]+", url).group(0)
                if origin.endswith("nathananderson.com"):
                    continue
                if origin not in ALLOWED:
                    found.setdefault(origin, set()).add(tag.lower())
        for origin, tags in sorted(found.items()):
            print(f"::error::cross-origin resource load not permitted by the CSP in "
                  f"static/_headers: {origin} (via <{'>, <'.join(sorted(tags))}>)")
        sys.exit(1 if found else 0)
        PY

    - name: Security headers check
      run: |
        # Headers are served by Cloudflare Pages from static/_headers.
        MISSING=0
        for h in Content-Security-Policy X-Frame-Options X-Content-Type-Options \
                 Referrer-Policy Permissions-Policy; do
          if ! grep -qi "$h" static/_headers; then
            echo "::error::static/_headers is missing $h"
            MISSING=1
          fi
        done
        exit $MISSING
    
    - name: HTTPS and SSL Check
      run: |
        # Check that baseURL uses HTTPS
        if ! grep -q "https://" hugo.toml; then
          echo "::warning::baseURL should use HTTPS in production"
        fi
    
    - name: Upload Security Report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: security-audit-report
        path: |
          hugo.toml
          public/**/*.html
        retention-days: 30