    title   = "I've seen this movie before — in 1998, 2008 and 2018."
    content = """
Series A and B startups hire me when they need executive-level technology leadership but aren't ready —
or funded enough — for a full-time CTO.

I started as the sole employee of a small ISP, scaling it from 100 to 3,000 customers in eighteen months.
I spent thirteen years at Rackspace as it became a cloud company. I've led engineering at ClearDATA building
HIPAA-compliant infrastructure, run global DevOps and compliance at Chargify through its acquisition, unified
four acquired brands at CyberFortress, and reported to the CEO at SWIVEL through a reorganisation and an exit.

That range matters because your problem is rarely purely technical. It's usually a technical problem wearing
an organisational costume — and pattern recognition is the thing you can't hire junior.

Outside client work I'm CTO of **Alenio Health (Tú TeleDoc)**, a telemedicine venture serving Mexico and Latin
America. I sit on the board of [Tech Bloc](https://satechbloc.com/) and the Leadership San Antonio Alumni
Association, and I mentor engineers, engineering leaders and founders at local universities.
