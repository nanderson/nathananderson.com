# ---------------------------------------------------------------------------
# Markup / output
# ---------------------------------------------------------------------------
[markup]
  [markup.goldmark.renderer]
    unsafe = false
  [markup.goldmark.parser]
    autoHeadingID = true
    autoHeadingIDType = "github"
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3
  [markup.highlight]
    style = "github"
    lineNos = false
    noClasses = true
    tabWidth = 4

[imaging]
  quality = 82
  resampleFilter = "Lanczos"
  anchor = "Smart"

[sitemap]
  changefreq = 'monthly'
  filename = 'sitemap.xml'
  priority = 0.5

[privacy.googleAnalytics]
  respectDoNotTrack = true

[mediaTypes."application/atom+xml"]
  suffixes = ["xml"]

[outputFormats.Atom]
  name = "Atom"
  mediaType = "application/atom+xml"
  baseName = "atom"
  isPlainText = false
  rel = "alternate"
  isHTML = false
  noUgly = true
  permalinkable = false

[outputFormats.LLMS]
  name = "LLMS"
  mediaType = "text/plain"
  baseName = "llms"
  isPlainText = true
  rel = "alternate"
  isHTML = false
  noUgly = true
  permalinkable = false

[outputs]
  home = ["HTML", "RSS", "ATOM", "LLMS", "robots"]
  section = ["HTML", "RSS", "ATOM"]
  taxonomy = ["HTML"]
  term = ["HTML"]

[minify]
  disableXML = true
  [minify.tdewolff.html]
    keepDocumentTags = true
    keepEndTags = true
    keepQuotes = true
